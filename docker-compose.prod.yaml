# Fixed project name: without it Compose uses the folder name, and ~/portfolio/back
# and ~/reader/back would both be project "back" (orphan warnings, and
# --remove-orphans would delete the other stack's container).
name: portfolio-back

services:
  portfolio_back:
    # Built and pushed by the release workflow, never built on the server.
    # IMAGE_TAG is the sha-<commit> tag being deployed; "latest" is never deployed.
    image: ghcr.io/vps-maengdok/portfolio-back:${IMAGE_TAG:?set IMAGE_TAG to the image tag to deploy}
    container_name: maengdok_portfolio_back
    # Secrets (APP_SECRET, DATABASE_URL...) are read at runtime, never baked into the image
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      # Only Traefik can reach this container (no published port, private Docker
      # networks), and Traefik overwrites any client-sent X-Forwarded-For.
      SYMFONY_TRUSTED_PROXIES: private_ranges
      SYMFONY_TRUSTED_HEADERS: x-forwarded-for,x-forwarded-proto,x-forwarded-host
    volumes:
      - portfolio_uploads:/srv/app/public/uploads
    networks:
      - proxy
      - portfolio
      - postgresql
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.portfolio-back.rule=Host(`back.maengdok.fr`)"
      - "traefik.http.routers.portfolio-back.entrypoints=websecure"
      - "traefik.http.services.portfolio-back.loadbalancer.server.port=8080"
    # Headroom for wkhtmltopdf (CV PDF)
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  portfolio_uploads:
    external: true
    name: portfolio_uploads

networks:
  proxy:
    name: proxy
    external: true
  portfolio:
    name: portfolio
    external: true
  postgresql:
    name: postgresql
    external: true
