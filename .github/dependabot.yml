version: 2

# Weekly version updates, opened against develop (pull requests always go to develop).
# Minor and patch updates are grouped into one pull request per ecosystem;
# major updates come as separate pull requests.
# Security updates are not affected by this file: GitHub opens them as soon as an
# advisory is published.
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(docker)
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(docker)
    groups:
      compose-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
