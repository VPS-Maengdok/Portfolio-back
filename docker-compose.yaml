services:
  portfolio_back:
    container_name: maengdok_portfolio_back
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: maengdok/portfolio_back:dev
    volumes:
      - ./:/srv/app
    ports:
      # Local only: never published on every interface
      - "127.0.0.1:8000:8080"
    healthcheck:
      # Healthy on any non-5xx answer (no /health route until P1.7)
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/) && [ \"$$code\" -ge 200 ] && [ \"$$code\" -lt 500 ]"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - portfolio
      - postgresql
    restart: unless-stopped

networks:
  portfolio:
    name: portfolio
    external: true
  postgresql:
    name: postgresql
    external: true
